<div class="animated-gradient">

  <div class="contenedor">

    <h2>Registrarse</h2>

    <form (ngSubmit)="registrar()">

      <input
        type="text"
        [(ngModel)]="usuario.nombre"
        name="nombre"
        placeholder="Nombre"
        required
      >

      

      <input
        type="email"
        [(ngModel)]="usuario.email"
        name="email"
        placeholder="Email"
        required
      >

      <input
        type="password"
        [(ngModel)]="usuario.password"
        name="password"
        placeholder="Contraseña"
        required
      >

      <button type="submit">
        Registrarse
      </button>

    </form>


    <p>
      ¿Ya tenés una cuenta?
      <a routerLink="/login">
        Iniciar sesión
      </a>
    </p>


  </div>

</div>
<div class="particles"></div>
<button type="submit">

Crear cuenta

</button>

</div>
