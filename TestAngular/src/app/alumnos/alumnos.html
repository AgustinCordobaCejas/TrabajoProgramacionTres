<div class="animated-gradient">


  <!-- Fondo partículas -->
  <div class="particles"></div>



  <div class="alumno-container">


    <div class="alumno-card">



      <h1>
        Gestión de Alumnos
      </h1>



      <p>
        Administración académica del sistema
      </p>





      <button
      *ngIf="esAdmin"
      mat-raised-button
      color="primary"
      class="nuevo-alumno"
      (click)="agregarAlumno()">


        + Nuevo alumno


      </button>

      <mat-form-field appearance="outline" class="filter-field">
        <mat-label>Filtrar alumnos</mat-label>
        <input matInput [(ngModel)]="filtro" (ngModelChange)="aplicarFiltro($event)" placeholder="Nombre, email o materia">
      </mat-form-field>

      <div class="table-box">



        <table 
        mat-table 
        [dataSource]="alumnos">





          <!-- ID -->

          <ng-container matColumnDef="id">


            <th mat-header-cell *matHeaderCellDef>

              ID

            </th>


            <td mat-cell *matCellDef="let alumno">

              {{ alumno.id }}

            </td>


          </ng-container>








          <!-- NOMBRE -->


          <ng-container matColumnDef="nombre">


            <th mat-header-cell *matHeaderCellDef>

              Nombre

            </th>


            <td mat-cell *matCellDef="let alumno">

              {{ alumno.nombre }}

            </td>


          </ng-container>








          <!-- EMAIL -->


          <ng-container matColumnDef="email">


            <th mat-header-cell *matHeaderCellDef>

              Email

            </th>


            <td mat-cell *matCellDef="let alumno">

              {{ alumno.email }}

            </td>


          </ng-container>








          <!-- MATERIA -->


          <ng-container matColumnDef="materia">


            <th mat-header-cell *matHeaderCellDef>

              Materia

            </th>


            <td mat-cell *matCellDef="let alumno">

              {{ alumno.materia }}

            </td>


          </ng-container>








          <!-- ACCIONES -->


          <ng-container matColumnDef="acciones">


            <th mat-header-cell *matHeaderCellDef>

              Acciones

            </th>



            <td mat-cell *matCellDef="let alumno">



              <button
              *ngIf="esAdmin"
              mat-button
              color="primary"
              (click)="editarAlumno(alumno)">


                Editar


              </button>





              <button
              *ngIf="esAdmin"
              mat-button
              color="warn"
              (click)="eliminar(alumno)">



                Eliminar


              </button>




            </td>



          </ng-container>









          <tr
          mat-header-row
          *matHeaderRowDef="displayedColumns">


          </tr>





          <tr
          mat-row
          *matRowDef="let row; columns: displayedColumns">


          </tr>




        </table>

        <mat-paginator
          [length]="totalCount"
          [pageIndex]="pageIndex"
          [pageSize]="pageSize"
          [pageSizeOptions]="[5, 10, 25, 50]"
          showFirstLastButtons
          (page)="cambiarPagina($event)">
        </mat-paginator>

      </div>




    </div>




  </div>




</div>
